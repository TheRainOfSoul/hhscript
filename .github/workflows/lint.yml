name: Lint scripts

# Все ПК тянут скрипт вживую с main — этот чек ловит битое ДО того, как оно
# попадёт всем. Красный крест = не мержим.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Syntax check (parse all .ps1)
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e) {
              $bad = $true
              Write-Host "::error::Syntax error in $($_.FullName)"
              $e | ForEach-Object { Write-Host "  $($_.Message)" }
            } else { Write-Host "OK: $($_.Name)" }
          }
          if ($bad) { exit 1 }

      # Ловит регрессию, из-за которой лаунчер лёг: BOM в файле проходит
      # синтаксический разбор, но ломает `irm | iex` на первом токене.
      - name: Delivery check (irm | iex)
        shell: pwsh
        run: ./tests/Test-Delivery.ps1

      - name: PSScriptAnalyzer (errors fail, warnings informational)
        shell: pwsh
        run: |
          $all = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error, Warning
          $errors = @($all | Where-Object Severity -eq 'Error')
          $warns  = @($all | Where-Object Severity -eq 'Warning')
          if ($warns)  { Write-Host "Warnings ($($warns.Count)):";  $warns  | Format-Table RuleName, ScriptName, Line, Message -AutoSize -Wrap }
          if ($errors) { Write-Host "Errors ($($errors.Count)):";   $errors | Format-Table RuleName, ScriptName, Line, Message -AutoSize -Wrap; exit 1 }
          Write-Host "No PSScriptAnalyzer errors."

      # Страж от баг-класса, который однажды уронил сканер: $script: внутри
      # .GetNewClosure() (в замыкании из функции = $null).
      - name: "Guard: script-scope в замыканиях"
        shell: pwsh
        run: ./tests/Check-ClosureScope.ps1

      # Тесты чистой логики: формулы калькулятора Dahua, трансформ jsDelivr.
      - name: Тесты логики (PowerShell)
        shell: pwsh
        run: ./tests/Test-Logic.ps1

  # Linux-скрипт (linux.sh) тянется вживую через `curl lin.hhtdom.ru | bash` —
  # CRLF или синтаксическая ошибка положат всех, кто его запускает.
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax (bash -n) + запрет CRLF
        run: |
          bad=0
          for f in $(git ls-files '*.sh'); do
            if grep -qP '\r$' "$f"; then echo "::error::$f содержит CRLF — bash сломается"; bad=1; fi
            if bash -n "$f"; then echo "OK: $f"; else echo "::error::Синтаксис в $f"; bad=1; fi
          done
          [ "$bad" = 0 ] || exit 1

      - name: shellcheck
        run: |
          for f in $(git ls-files '*.sh'); do
            shellcheck --exclude=SC1091 "$f" || exit 1
          done

      - name: Тесты логики (Linux)
        run: bash tests/test-linux-logic.sh
